<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Форма замовлення</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f4;--card:#fff;--ink:#17261f;--muted:#5f6f67;--line:#d3ddd7;--accent:#1f6b4f;--accent-ink:#fff;--err:#b3261e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18241e;--ink:#e8f0eb;--muted:#9bb0a5;--line:#2c3d34;--accent:#4fb88b;--accent-ink:#06130d;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#101814;--card:#18241e;--ink:#e8f0eb;--muted:#9bb0a5;--line:#2c3d34;--accent:#4fb88b;--accent-ink:#06130d;--err:#ff8a80}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:16px;margin:0 0 16px}
legend{font-weight:700;padding:0 6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:0}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.name{font-weight:600}
.price{color:var(--muted);font-size:.9rem}
.qty{display:flex;align-items:center;gap:6px;visibility:hidden}
.item.on .qty{visibility:visible}
.qty button{width:32px;height:32px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:1.1rem;cursor:pointer}
.qty input{width:48px;height:32px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:.92rem}
label.f input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bad{border-color:var(--err)!important}
.err{color:var(--err);font-size:.88rem;min-height:1.2em;margin:4px 0 0}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;padding:4px 0 14px}
.send{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.ok{background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:18px}
.ok ul{padding-left:18px}
[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>Замовлення товару</h1>
<p class="sub">Оберіть товари, вкажіть кількість і залиште контакти.</p>

<form id="f" novalidate>
<fieldset>
<legend>Товари</legend>
<div id="items"></div>
<p class="err" id="itemsErr" role="alert"></p>
</fieldset>

<fieldset>
<legend>Контактні дані</legend>
<label class="f">Ім'я<input id="fn" autocomplete="given-name" required></label>
<label class="f">Прізвище<input id="ln" autocomplete="family-name" required></label>
<label class="f">Номер телефону<input id="ph" type="tel" autocomplete="tel" placeholder="+380 50 123 45 67" required></label>
<p class="err" id="contactErr" role="alert"></p>
</fieldset>

<div class="total"><span>Разом</span><span id="total">0 грн</span></div>
<button type="submit" class="send">Замовити</button>
</form>

<section class="ok" id="done" hidden></section>
</main>

<script>
// Вставте сюди URL вебхука з Zapier (Webhooks by Zapier → Catch Hook)
const WEBHOOK_URL="https://hooks.zapier.com/hooks/catch/27834950/4mwrqcf/";
const products=[{n:"Товар 1",p:100},{n:"Товар 2",p:200},{n:"Товар 3",p:300},{n:"Товар 4",p:400}];
const box=document.getElementById("items");
const state=products.map(()=>({on:false,q:1}));

products.forEach((pr,i)=>{
  const row=document.createElement("div");row.className="item";
  row.innerHTML=`<input type="checkbox" id="c${i}" aria-label="${pr.n}">
  <label for="c${i}"><span class="name">${pr.n}</span><br><span class="price">${pr.p} грн</span></label>
  <div class="qty"><button type="button" aria-label="Менше">−</button><input type="number" min="1" max="99" value="1" aria-label="Кількість"><button type="button" aria-label="Більше">+</button></div>`;
  const cb=row.querySelector("input[type=checkbox]"),num=row.querySelector("input[type=number]"),[minus,plus]=row.querySelectorAll("button");
  const sync=()=>{state[i].q=Math.max(1,Math.min(99,parseInt(num.value)||1));num.value=state[i].q;row.classList.toggle("on",state[i].on);calc()};
  cb.onchange=()=>{state[i].on=cb.checked;if(cb.checked)state[i].q=1,num.value=1;sync()};
  minus.onclick=()=>{num.value=(parseInt(num.value)||1)-1;sync()};
  plus.onclick=()=>{num.value=(parseInt(num.value)||0)+1;sync()};
  num.onchange=sync;
  box.appendChild(row);
});

function calc(){
  const t=state.reduce((s,x,i)=>s+(x.on?x.q*products[i].p:0),0);
  document.getElementById("total").textContent=t+" грн";
  if(state.some(x=>x.on))document.getElementById("itemsErr").textContent="";
  return t;
}

document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const fn=document.getElementById("fn"),ln=document.getElementById("ln"),ph=document.getElementById("ph");
  let ok=true;
  const picked=state.map((x,i)=>x.on?{...products[i],q:x.q}:null).filter(Boolean);
  document.getElementById("itemsErr").textContent=picked.length?"":"Оберіть щонайменше один товар.";
  if(!picked.length)ok=false;
  [fn,ln,ph].forEach(el=>el.classList.remove("bad"));
  const digits=ph.value.replace(/\D/g,"");
  const bad=[];
  if(!fn.value.trim())bad.push(fn);
  if(!ln.value.trim())bad.push(ln);
  if(digits.length<10||digits.length>13)bad.push(ph);
  bad.forEach(el=>el.classList.add("bad"));
  document.getElementById("contactErr").textContent=bad.length?"Заповніть ім'я, прізвище та номер телефону (10-12 цифр, наприклад 0501234567).":"";
  if(bad.length)ok=false;
  if(!ok)return;
  const total=calc();
  const btn=document.querySelector(".send");
  btn.disabled=true;btn.textContent="Надсилаємо…";
  let phoneNorm="+"+digits;
  if(digits.length===10&&digits[0]==="0")phoneNorm="+38"+digits;
  const orderId="ORD-"+Date.now().toString(36).toUpperCase();
  const rows=picked.map(p=>new URLSearchParams({
    order_id:orderId,
    product_name:p.n,
    quantity:String(p.q),
    price:String(p.p),
    line_total:String(p.q*p.p),
    order_total:String(total),
    first_name:fn.value.trim(),
    last_name:ln.value.trim(),
    phone:phoneNorm
  }));
  try{
    // окремий запит на кожен товар = окремий рядок у таблиці
    // no-cors: Zapier приймає запит, але браузер не показує відповідь
    await Promise.all(rows.map(body=>fetch(WEBHOOK_URL,{method:"POST",mode:"no-cors",body})));
  }catch(err){
    btn.disabled=false;btn.textContent="Замовити";
    document.getElementById("contactErr").textContent="Не вдалося надіслати замовлення. Перевірте інтернет і спробуйте ще раз.";
    return;
  }
  const d=document.getElementById("done");
  const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  d.innerHTML=`<h2>Дякуємо, ${esc(fn.value.trim())}!</h2><p>Ваше замовлення <b>${orderId}</b> прийнято:</p><ul>${picked.map(p=>`<li>${p.n} — ${p.q} шт × ${p.p} грн = ${p.q*p.p} грн</li>`).join("")}</ul><p><b>Разом: ${total} грн</b></p><p>Телефон: ${esc(ph.value.trim())}</p>`;
  d.hidden=false;document.getElementById("f").hidden=true;d.scrollIntoView();
});
</script>
</body>
</html>
